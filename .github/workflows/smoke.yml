# Phase 7 · 冒烟与隔离红线（spec `docs/sandbox-spec.md` 的 Phase 7）
#
# 【为什么这个文件必须存在，而且必须跑在 Linux 上】§J 末尾那句话是这个 workflow 的
# 唯一理由："macOS 的 Docker Desktop 使用不同的内核和 seccomp 行为，本机通过不代表生产通过。"
# 本地跑冒烟是开发者的便利，**红线只有在 Linux 内核上跑出来的绿才算数**。
#
# 【两个 job，第二个是"有牙齿"的证据】
#   smoke            正常跑全套。CI 里**没有任何跳过失败项的开关**——spec Phase 7 §4 的硬要求。
#   negative-control 故意把 `CapDrop` 清空（`SMOKE_NEGATIVE_CONTROL=1`，钩子在
#                    provider/local-docker.ts 的 buildSandboxContainerRequest 里，一眼可见），
#                    再跑 `--tag=isolation`，然后**断言它必须失败**，且失败原因正是 CapDrop。
#                    注意「原因」核对的是**断言消息**（`CapDrop 必须是`），不能只 grep `CapDrop`：
#                    入口自己会打一行 `⚠️ …CapDrop 被故意拿掉…`，任何故障都能骗过那个写法
#                    （Phase 7 备注 19 记了 CI 第四轮是怎么被骗的）。
# 少了第二个 job，第一个 job 就只是一段永远绿的装饰性代码——你永远不知道它是不是其实
# 什么都没在测（这一句也是 spec 的原话）。
#
# 【触发条件】pull_request（每个 PR 都跑）+ push 到 main（合并/直推之后仍然验一遍，
# 也是这个仓库第一次推送就能看到结果的原因）+ workflow_dispatch（要单独复跑一遍时用，
# 不必为了跑一次 CI 推一个空 commit）。

name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同一个分支上新的 push 取消上一次没跑完的冒烟：镜像构建几分钟，没必要排队浪费时间。
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: 冒烟（Linux · 全部标签）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 几秒钟就能跑完的那两类检查，放在最前面：类型与单元测试一旦挂了，
      # 没必要先花几分钟建镜像才知道。它们不需要 Docker、不需要网络。
      # 输出 tee 到文件：失败时下面那个诊断步骤会把**挂掉的用例名**变成 annotation
      # （GitHub 的 annotations 框里默认只有 job 名，"哪一条用例挂了"才是一眼要看的东西）。
      - name: 快速检查（类型 + 单元测试，不需要 Docker）
        run: |
          set -o pipefail
          npm run typecheck
          npm test 2>&1 | tee /tmp/unit.log

      - name: 构建沙箱镜像与出网代理镜像
        run: |
          npm run build:image
          npm run build:proxy-image

      - name: 记录镜像 digest 与存储驱动（排障时要能对上"跑的到底是哪个镜像"）
        run: |
          # RepoDigests 是这一轮才打出来的关键信息：经典存储（overlay2 / graphdriver）下，
          # 本地构建的镜像**没有** RepoDigests（`[]`），resolveImageRef() 只能退回镜像 ID——
          # CI 第四轮的"四个冒烟组全灭"与那条路上的 invalid_spec 逐字一致（见 docs/sandbox-spec.md
          # Phase 7 备注 19），这行 log 就是下一轮的确认手段。
          docker image inspect --format 'sandbox-base: {{.Id}} digests={{json .RepoDigests}}' reuben-cloud/sandbox-base:dev
          docker image inspect --format 'egress-proxy: {{.Id}} digests={{json .RepoDigests}}' reuben-cloud/egress-proxy:dev
          docker info --format '镜像存储：{{.Driver}} {{json .DriverStatus}}；Docker {{.ServerVersion}}'

      - name: 起出网代理
        run: npm run proxy:up

      # 这一条是 CI 里唯一允许跑的冒烟命令：不带 --tag，即全部标签、无任何跳过。
      # （`npm run smoke` 自己也会幂等地把代理 ensureRunning 起来，上面那一步是显式的记录。）
      - name: 冒烟（全部）
        run: |
          set +e
          npm run smoke 2>&1 | tee /tmp/smoke.log
          exit ${PIPESTATUS[0]}

      - name: 失败时收集诊断信息
        if: failure()
        run: |
          # 日志里"挂掉的用例名"与"真正的原因"在**两处**：✖ 那一行只有名字，原因
          # （AssertionError / ProviderError / before 钩子失败）在详情块里。所以：
          #   1) 把两个日志的第一条错误连栈打出来，并把它变成 annotation
          #      （annotations 框里默认只有 job 名，而 CI 失败的第一轮往往只能拿到一张截图）；
          #   2) 把冒烟日志的**开头**（preflight：平台 / 镜像引用 / 代理）也贴上——
          #      "根本没起沙箱"与"用例断言挂了"的区别就在那几行里。
          # `|| true`：head 凑够行数就关管道，grep 会收到 EPIPE；那行 Broken pipe 无害，
          # 但看着像第二个故障。
          dump_errors() {
            local log="$1" line
            [ -f "$log" ] || return 0
            echo "===== $log 里失败的用例（✖）====="
            grep -E "^[[:space:]]*(✖|not ok)" "$log" | head -20 || true
            line="$(grep -n -m 1 -E '^ +[A-Za-z]*Error( \[[A-Za-z_]+\])?:' "$log" | cut -d: -f1 || true)"
            if [ -n "$line" ]; then
              echo "===== $log 第一条错误（$line 行起，含栈）====="
              sed -n "${line},$((line + 25))p" "$log"
              # annotation 里放不下整段栈，放错误的消息行（% 要转义成 %25，否则 GitHub 会当成自己的转义）。
              echo "::error::$(sed -n "${line}p" "$log" | sed 's/^ *//; s/%/%25/g')"
            fi
          }
          dump_errors /tmp/unit.log
          dump_errors /tmp/smoke.log

          echo "===== 冒烟日志开头（preflight）====="
          head -40 /tmp/smoke.log 2>/dev/null || true

          docker ps -a
          docker network inspect reuben-cloud-internal || true
          docker logs reuben-cloud-proxy --tail 200 || true
          for container in $(docker ps -a --filter 'label=reuben-cloud.managed=true' --format '{{.Names}}'); do
            echo "===== docker logs $container ====="
            docker logs "$container" --tail 100 || true
          done
          echo "===== 冒烟日志尾部 ====="
          tail -80 /tmp/smoke.log 2>/dev/null || true

  negative-control:
    name: 反向验证（拿掉 CapDrop，红线必须变红）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建沙箱镜像与出网代理镜像
        run: |
          npm run build:image
          npm run build:proxy-image

      - name: 起出网代理
        run: npm run proxy:up

      - name: 故意破坏 CapDrop → --tag=isolation 必须失败
        env:
          SMOKE_NEGATIVE_CONTROL: "1"
        run: |
          set +e
          npm run smoke -- --tag=isolation 2>&1 | tee /tmp/negative-control.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::红线没有牙齿：把 CapDrop 清空之后 --tag=isolation 仍然全绿。"
            echo "::error::去 packages/e2e/test/isolation.smoke.ts 的 I10 看看那条断言是不是被改坏了。"
            exit 1
          fi

          # 失败必须是**我们故意的那个原因**。否则一个坏掉的 runner（Docker 挂了、镜像没建出来）
          # 也会让这个 job"通过"，那就从"有牙齿"退化成了"只要红就行"。
          #
          # 两道检查。第一道先排除"根本没跑到用例"：建沙箱阶段挂掉时，整个 isolation 组
          # 会被 node --test 报成 cancelled（`did not finish before its parent`），那同样是非 0 退出。
          if grep -qE "did not finish before its parent|Error \[ProviderError\]" /tmp/negative-control.log; then
            echo "::error::isolation 在建沙箱/加载阶段就挂了，不是 I10 那条断言——先看上面的日志开头。"
            head -40 /tmp/negative-control.log
            exit 1
          fi

          # 第二道核对**断言消息**，而不是随便一个含 `CapDrop` 的行：入口自己那行提示
          # （`⚠️ SMOKE_NEGATIVE_CONTROL=1：CapDrop 被故意拿掉…`）里就有这个词，
          # 只 grep `CapDrop` 的话，任何原因导致的失败都能骗过这道门（CI 第四轮就是这么被骗的）。
          if ! grep -qF 'CapDrop 必须是' /tmp/negative-control.log; then
            echo "::error::isolation 确实失败了，但失败原因不是 CapDrop 那条断言——见上面日志，"
            echo "::error::先确认不是环境问题（Docker daemon / 镜像 / 代理）。"
            exit 1
          fi

          echo "反向验证通过：拿掉 CapDrop 之后红线变红，且失败原因正是 CapDrop。"

      - name: 反向验证失败时收集诊断信息
        if: failure()
        run: |
          # 这个 job 的失败有两种：真环境坏了，或者"红的原因不对"。两种都要看**开头**
          # （preflight 的镜像引用 / 代理）——只看尾部会把"建沙箱失败"当成断言失败。
          echo "===== 反向验证日志开头（preflight）====="
          head -40 /tmp/negative-control.log 2>/dev/null || true
          echo "===== 反向验证日志尾部 ====="
          tail -120 /tmp/negative-control.log 2>/dev/null || true
          docker ps -a || true
