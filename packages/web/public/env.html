<!doctype html>
<!--
  Phase 7 · 环境页（`docs/agent-runtime-spec.md` §Phase 7 §4）。

  【它显示什么】一个仓库的环境现状：当前是哪一版、状态（ready / degraded / failed / building）、
  体检结论与结构化事实、以及历次构建（每次尝试的 inference / 状态 / 错误分类 / 日志）。
  这三样正是设计文档 §C.6 说的"把'环境能不能用'变成显式状态"——没有这个页面，那句状态就只在
  数据库里。

  【为什么与观察窗共用一套文件（index.html / app.js）之外的两个文件】观察窗是"一次执行"的
  视图，环境页是"一个仓库"的视图：它们的输入（SSE 事件流 vs 一个 JSON 读模型）、生命周期
  （秒级流）都不一样。硬塞进一个 app.js 只会让两边的状态机互相污染。

  【为什么仍然零构建、零外链】与观察窗同一条理由：没有字体 CDN、没有图标库、没有分析脚本。
  它跑在本机回环上、给一个开发者看：任何外部请求都只是新的失败面与新的供应链面。

  【那个按钮为什么会写】"构建 / 重建"是这个页面唯一的写口（spec §4：manual 触发的第二个入口）。
  它走的是一条 POST——一个 GET 不该有副作用（浏览器预取、链接重放都会踩到）。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>reuben-cloud · 环境</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/env.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar__inner">
        <div class="bar__left">
          <span class="brand">reuben-cloud</span>
          <span class="bar__run" id="env-project" title="这个仓库的 project_key">…</span>
        </div>
        <div class="bar__right">
          <span class="state" id="env-state" data-state="connecting" role="status">
            <span class="state__dot" aria-hidden="true"></span>
            <span class="state__text" id="env-state-text">读取中</span>
          </span>
          <button class="button" type="button" id="theme">跟随系统</button>
        </div>
      </div>
    </header>

    <main class="page">
      <!-- 当前那一版的摘要（revision / 状态 / 缓存键 / digest）。内容全部由 env.js 用 textContent 写。 -->
      <section class="card" id="env-current" aria-label="当前环境"></section>
      <!-- 体检结论与结构化事实（degraded 时 agent 会据此跳过集成测试）。 -->
      <section class="note" id="env-health" aria-label="体检结论" hidden></section>
      <!-- 手动触发的唯一入口：manual 入队。 -->
      <section class="env__actions">
        <button class="button button--solid" type="button" id="env-build-button">构建 / 重建</button>
        <span class="env__hint" id="env-build-hint"></span>
      </section>
      <p class="card__text" id="env-message" role="status"></p>
      <!-- 历次 revision 与它们的构建行。 -->
      <div id="env-revisions"></div>
    </main>

    <noscript>
      <p class="page page--plain">这个页面靠 JavaScript 读 `/env/&lt;projectKey&gt;/info`。请打开 JavaScript 再刷新。</p>
    </noscript>
  </body>
</html>
